    - ID: "0a175efb-4a64-4c4e-b602-bcb213df5529"
      Hint: Content
      Value: <p>Sitecore Experience Manager Cloud（XM Cloud）は、開発者やマーケティング担当者が、SitecoreのヘッドレスCMSを使用して、魅力的なオムニチャネル体験をクラウド上で効率的に立ち上げることができる、完全に管理されたセルフサービス型の展開プラットフォームです。Experience Manager Cloudには、Experience Managerの最新バージョン、Pagesエディター、Sitecore Headless Experience Accelerator（SXA）、Headless Services、Sitecore Next.js SDK（およびその他のHead）、Experience Edgeがバンドルされています。</p>
