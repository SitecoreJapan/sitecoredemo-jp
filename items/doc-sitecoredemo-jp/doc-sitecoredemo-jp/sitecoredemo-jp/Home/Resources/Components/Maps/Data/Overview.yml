        ## Maps Component
        
        This is a component for embedding Google Maps into a page.
        
        ## Package in use
        
        - vis.gl/react-google-maps
        
        ## Environment Variables
        
        Please add the Google Maps API key using the following environment variables.
        
        - NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
