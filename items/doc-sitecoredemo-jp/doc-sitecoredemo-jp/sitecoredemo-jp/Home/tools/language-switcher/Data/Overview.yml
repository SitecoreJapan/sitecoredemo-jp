        ## Language Switching Tool
        
        Our language switching tool provides a convenient feature that allows users to easily select their preferred language. It currently supports **Danish**, French, German, and Japanese, enabling *smooth* language switching with just one click.
        
        ## Sample
        
        ### Main Features:
        
        - Intuitive UI – Simple and easy-to-use design
        - Instant Switching – Change languages without reloading the page
        - Multilingual Support – Supports four languages, with plans for future expansion
        
        ## Sample 2 
        
        By utilizing this tool, you can provide a more comfortable browsing experience for a wider audience. Give it a try!
