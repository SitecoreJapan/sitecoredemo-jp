        <h3>Next.js x Tailwind CSS x XM Cloud Starter Kit</h3>
        
        <p>The best development experience, the fastest. </p>
        <p>This starter kit maximizes the powerful features of XM Cloud with the modern development stack of Next.js and Tailwind CSS. Combine development speed and performance to quickly build sophisticated UIs while taking advantage of the flexibility of a headless CMS. </p>
        <ul>
        <li>Optimized performance and SEO with Next.js</li>
        <li>Efficient and customizable design with Tailwind CSS</li>
        <li>Seamless integration with XM Cloud for enhanced content management</li>
        <li>No development environment setup required! Build and deploy instantly in the cloud</li>
        </ul>
        <p>Faster and freer Sitecore development with this starter kit. </p>
